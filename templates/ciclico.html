<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INJUL - Monitoreo Cíclico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fa-solid fa-video me-2"></i>INJUL CCTV</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Resumen General</a>
                <a class="nav-link active" href="/ciclico">Monitoreo Cíclico</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3"><i class="fa-solid fa-rotate me-2"></i>Monitoreo Cíclico del Día</h3>
            <h5 class="text-primary mb-4">Sucursal en rotación hoy: <strong>{{ sucursal_hoy }}</strong></h5>

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Cámara del Ciclo</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cam in camaras_dia %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td><strong>{{ cam }}</strong></td>
                            <form action="/ciclico/guardar" method="POST">
                                <input type="hidden" name="sucursal" value="{{ sucursal_hoy }}">
                                <input type="hidden" name="camara" value="{{ cam }}">
                                <td>
                                    <select name="estado" class="form-select form-select-sm">
                                        <option value="Operativa">Operativa</option>
                                        <option value="No visible">No visible</option>
                                        <option value="Por verificar">Por verificar</option>
                                    </select>
                                </td>
                                <td>
                                    <button type="submit" class="btn btn-sm btn-success">Guardar</button>
                                </td>
                            </form>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
